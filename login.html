<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — EvoLab CRM</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101318;color:#f5f7fc;font:16px system-ui}main{width:min(400px,90vw);padding:30px;border:1px solid #38485f;border-radius:16px;background:#1d2736}h1{font-family:monospace}label{display:block;margin:15px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#121c2a;border:1px solid #455975;color:white}button{margin-top:20px;width:100%;padding:12px;background:#38bdf8;border:0;border-radius:8px;font-weight:bold;cursor:pointer}a{color:#67e8f9}p{color:#b1bfd2}</style><main><h1>EvoLab.</h1><p>Entre para acessar o CRM compartilhado.</p><form id="login"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Entrar</button></form><p id="message" role="status"></p><p><a href="reset.html">Esqueci minha senha</a></p></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button'),message=document.querySelector('#message');button.disabled=true;message.textContent='Entrando...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form))),credentials:'same-origin'});const data=await r.json();if(!r.ok)throw Error(data.error||'Não foi possível entrar');location.replace('./')}catch(err){message.textContent=err.message;button.disabled=false}})</script></html>
