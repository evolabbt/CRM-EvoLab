<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar acesso — EvoLab</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101318;color:#f5f7fc;font:16px system-ui}main{width:min(430px,90vw);padding:30px;border:1px solid #38485f;border-radius:16px;background:#1d2736}h1{font-family:monospace}label{display:block;margin:15px 0 5px}input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#121c2a;border:1px solid #455975;color:white}button{margin-top:20px;width:100%;padding:12px;background:#38bdf8;border:0;border-radius:8px;font-weight:bold;cursor:pointer}a{color:#67e8f9}p{color:#b1bfd2}</style><main><h1>EvoLab.</h1><h2>Primeiro acesso</h2><p>Configure sua conta uma única vez. A chave de ativação não será salva no navegador.</p><form id="form"><label for="username">Usuário</label><select id="username"><option value="kevin">kevin</option><option value="bryan">bryan</option></select><label for="email">E-mail para recuperação</label><input id="email" type="email" autocomplete="email" required><label for="password">Crie sua senha (mínimo 6 caracteres)</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><label for="secret">Chave de ativação (BOOTSTRAP_SECRET)</label><input id="secret" type="password" autocomplete="off" required><button>Criar minha conta</button></form><p id="message" role="status"></p><p><a href="login.html">Voltar ao login</a></p></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),message=document.querySelector('#message');button.disabled=true;message.textContent='Criando conta...';try{const r=await fetch('/api/auth/bootstrap',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,recovery_email:document.querySelector('#email').value,password:document.querySelector('#password').value,secret:document.querySelector('#secret').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Não foi possível criar conta');message.textContent='Conta criada! Agora entre com seu usuário e senha.';e.target.reset()}catch(err){message.textContent=err.message}finally{button.disabled=false}})</script></html>
