<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — EvoLab CRM</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101318;color:#f5f7fc;font:16px system-ui}main{width:min(400px,90vw);padding:30px;border:1px solid #38485f;border-radius:16px;background:#1d2736}h1{font-family:monospace}label{display:block;margin:15px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;background:#121c2a;border:1px solid #455975;color:white}button{margin-top:20px;width:100%;padding:12px;background:#38bdf8;border:0;border-radius:8px;font-weight:bold;cursor:pointer}a{color:#67e8f9}p{color:#b1bfd2}</style><main><h1>EvoLab.</h1><h2 id="heading">Recuperar senha</h2><form id="form"><label for="entry" id="label">Seu usuário</label><input id="entry" required><button id="submit">Enviar instruções</button></form><p id="message" role="status"></p><p><a href="login.html">Voltar ao login</a></p></main><script>const token=new URLSearchParams(location.search).get('token'),form=document.querySelector('#form'),entry=document.querySelector('#entry');if(token){document.querySelector('#heading').textContent='Criar nova senha';document.querySelector('#label').textContent='Nova senha (mínimo 12 caracteres)';entry.type='password';entry.minLength=12;entry.autocomplete='new-password';document.querySelector('#submit').textContent='Redefinir senha'}form.addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit'),message=document.querySelector('#message');button.disabled=true;message.textContent='Processando...';try{const r=await fetch(token?'/api/auth/reset':'/api/auth/recover',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(token?{token,password:entry.value}:{username:entry.value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Falha na solicitação');message.textContent=data.message||'Senha alterada. Você já pode entrar.';form.reset()}catch(err){message.textContent=err.message}finally{button.disabled=false}})</script></html>
